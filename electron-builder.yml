appId: com.tpp.bgremover
productName: Background Remover
copyright: Copyright © 2026 TPP

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  - "!**/*.map"

# Include the bundled worker + the per-platform Node sidecar binary
# under Resources/.  electron-builder substitutes ${platform} and
# ${arch} from the build target.
extraResources:
  - from: resources/node-binaries/${os}-${arch}
    to: node-bin
    filter:
      - "**/*"
  - from: out/worker
    to: worker
    filter:
      - "**/*"

# The vanilla-Node sidecar (`out/worker/index.js` running under
# `Resources/node-bin/node`) cannot read files inside an asar
# archive — asar is an Electron extension that vanilla Node doesn't
# know about. Anything the worker `require()`s at runtime must be
# unpacked so Node's regular file-system resolver can see it.
#
# We unpack **every** node_modules subdirectory rather than trying
# to enumerate the worker's transitive dependency tree. That tree
# is large (transformers.js pulls in onnxruntime-common, jszip,
# protobufjs, etc.) and changes between minor library versions, so
# every targeted pattern eventually turns into a whack-a-mole.
# Unpacking everything costs a few extra ms at install time and
# zero ms at runtime — asar is primarily a startup-speed
# optimization for Electron's own code paths (main + preload +
# renderer), which still live inside `app.asar`. The only thing in
# `app.asar.unpacked/` is `node_modules/` itself.
asar: true
asarUnpack:
  - "**/node_modules/**"

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.graphics-design
  identity: null
  # icon.icns is built by `npm run icons` (macOS only). electron-builder
  # picks it up automatically; specifying the path also works.
  icon: resources/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
  # On Windows we let electron-builder generate the .ico from icon.png
  # (it auto-resizes to the multi-size ICO format). Saves us a tool.
  icon: resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
